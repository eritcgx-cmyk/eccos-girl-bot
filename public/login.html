<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ecco's girl</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0d0d12;
            color: #e8e0f0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrap {
            width: 100%;
            max-width: 400px;
            padding: 32px 28px;
            background: #13111c;
            border: 1px solid #22203a;
            border-radius: 16px;
            text-align: center;
        }

        .login-pfp {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #c467ff;
            margin-bottom: 18px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #f0e8ff;
        }

        h1 span { color: #c467ff; }

        p {
            font-size: 0.9rem;
            color: #7a6e8a;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .discord-login-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: #5865F2;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            padding: 14px 20px;
            border-radius: 10px;
            text-decoration: none;
            transition: background 0.2s, transform 0.1s;
        }
        .discord-login-btn:hover { background: #4752C4; transform: translateY(-1px); }

        .discord-icon { width: 22px; height: 22px; fill: currentColor; }
        .sub-note { font-size: 0.78rem; color: #3d3555; margin-top: 18px; }
    </style>
</head>
<body>
    <div class="login-wrap">
        <img src="/pfp.jpg" alt="ecco's girl" class="login-pfp" onerror="this.style.display='none'">
        <h1>ecco's <span>girl</span></h1>
        <p>Sign in with your Discord account to access the website and control dashboard.</p>
        <a href="/auth/discord" class="discord-login-btn">
            <svg class="discord-icon" viewBox="0 0 127.14 96.36">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a74.77,74.77,0,0,0,64.3,0c.87.69,1.76,1.37,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-18.93-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.92,53.87,53,48.73,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.92,96.1,53,91,65.69,84.69,65.69Z"/>
            </svg>
            Login with Discord
        </a>
        <p class="sub-note">Only whitelisted accounts will be granted access.</p>
    </div>
</body>
</html>
