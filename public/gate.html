<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ecco's girl</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0d0d12;
            color: #e8e0f0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gate-wrap {
            width: 100%;
            max-width: 360px;
            padding: 24px;
            text-align: center;
        }

        .gate-pfp {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #c467ff;
            margin-bottom: 18px;
        }

        .gate-pfp-fallback {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c467ff, #ff6eb4);
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #f0e8ff;
        }

        h1 em {
            font-style: normal;
            color: #c467ff;
        }

        .gate-sub {
            font-size: 0.85rem;
            color: #7a6e8a;
            margin-bottom: 28px;
        }

        .gate-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .pw-input {
            background: #1a1625;
            border: 1px solid #2e2840;
            border-radius: 10px;
            padding: 12px 16px;
            color: #e8e0f0;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
            text-align: center;
            letter-spacing: 0.08em;
        }
        .pw-input:focus { border-color: #c467ff; }
        .pw-input::placeholder { color: #4a4060; letter-spacing: 0; }

        .pw-btn {
            background: #c467ff;
            border: none;
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Space Grotesk', sans-serif;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }
        .pw-btn:hover { background: #b040f0; transform: translateY(-1px); }
        .pw-btn:active { transform: none; }
        .pw-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .gate-error {
            font-size: 0.82rem;
            color: #ed4245;
            margin-top: 4px;
            display: none;
        }
        .gate-error.show { display: block; }
    </style>
</head>
<body>
    <div class="gate-wrap">
        <img src="/pfp.jpg" alt="ecco's girl" class="gate-pfp" onerror="this.outerHTML='<div class=gate-pfp-fallback>💕</div>'">
        <h1>ecco's <em>girl</em></h1>
        <p class="gate-sub">enter the password to continue</p>
        <form class="gate-form" id="gateForm">
            <input
                type="password"
                class="pw-input"
                id="pwInput"
                placeholder="password"
                autocomplete="off"
                autofocus
            >
            <p class="gate-error" id="gateError">wrong password, try again</p>
            <button type="submit" class="pw-btn" id="pwBtn">enter</button>
        </form>
    </div>

    <script>
        const form  = document.getElementById('gateForm');
        const input = document.getElementById('pwInput');
        const btn   = document.getElementById('pwBtn');
        const err   = document.getElementById('gateError');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            err.classList.remove('show');
            btn.disabled = true;
            btn.textContent = '...';

            try {
                const res = await fetch('/api/verify-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: input.value })
                });
                const data = await res.json();

                if (data.ok) {
                    window.location.href = '/';
                } else {
                    err.classList.add('show');
                    input.value = '';
                    input.focus();
                }
            } catch {
                err.textContent = 'server error, try again';
                err.classList.add('show');
            } finally {
                btn.disabled = false;
                btn.textContent = 'enter';
            }
        });
    </script>
</body>
</html>
