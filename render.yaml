services:
  - type: web
    name: eccos-girl-bot
    env: node
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: SITE_PASSWORD
        value: eccosgirl
      - key: SESSION_SECRET
        value: eccos_girl_super_secret_session_2026
      - key: PORT
        value: 3000
